<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://art.local data:; connect-src https://shelf.local/disc-drive.wav; object-src 'none'; base-uri 'none'">
<title>Self Coverflow</title><link rel="stylesheet" href="shelf.css"><script defer src="strings.js"></script><script defer src="drive-sound.js"></script><script defer src="shelf.js"></script></head>
<body><main>
<header id="grip" title="Drag to move Self Coverflow"><button id="filter" title="Switch between favorites and all albums">Favorites <span aria-hidden="true">⌄</span></button><div id="lookup">
<form id="searchForm" role="search" autocomplete="off">
<button type="button" id="searchToggle" aria-label="Search albums" title="Search albums" aria-expanded="false" aria-controls="albumQuery"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.1"/><path d="m12.3 12.3 3.9 3.9"/></svg></button>
<input id="albumQuery" role="combobox" aria-label="Search albums" placeholder="Search albums" aria-autocomplete="list" aria-expanded="false" aria-controls="albumMatches" spellcheck="false" disabled>
</form><div id="searchPanel" hidden><div id="albumMatches" role="listbox" aria-label="Matching albums"></div><div id="searchEmpty" role="status" hidden>No matching albums</div></div></div><output id="counter"></output>
<button id="pin" aria-label="Pin on top" aria-pressed="false" title="Pin on top"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(35 12 12)"><path d="M8 3.5h8l-1.3 3v4.1l2.8 3v1.2h-11v-1.2l2.8-3V6.5z"/><path d="M12 15v6"/></g></svg></button><button id="menu" aria-label="More options" title="More options">•••</button></header>
<section class="gallery" aria-label="Cover Flow">
<div id="stage" tabindex="0" aria-label="Drag sideways to browse, double-click to play, or pull vertically for lyrics. Press Enter to play the selected album."><div id="covers"></div></div>
<div class="caption"><h1 id="album">Loading your library…</h1><p id="artist"></p></div>
</section>
<div class="bar"><button id="prev" aria-label="Previous album" title="Previous album"><i></i></button><button id="transport" aria-label="Play" title="Play"><i></i></button><button id="next" aria-label="Next album" title="Next album"><i></i></button></div>
<output id="status" aria-live="polite"></output>
<nav id="options" hidden><div class="sizes" role="group" aria-label="Window width"><button data-size="classic" aria-pressed="true">Classic</button><button data-size="half" aria-pressed="false">Half</button><button data-size="wide" aria-pressed="false">Full</button></div><button id="switch">Show all albums</button><button id="lyrics">Lyrics</button><button type="button" id="driveSoundSwitch" role="switch" aria-checked="true">Simulation Effects<span aria-hidden="true"></span></button><button id="refresh">Refresh library</button><button id="dock">Attach to desktop</button><button id="close">Close Self Coverflow</button></nav>
</main></body></html>

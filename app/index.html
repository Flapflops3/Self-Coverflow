<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://art.local data:; connect-src https://shelf.local/disc-drive.wav; object-src 'none'; base-uri 'none'">
<title>Self Coverflow</title><link rel="stylesheet" href="shelf.css"><script defer src="strings.js"></script><script defer src="drive-sound.js"></script><script defer src="shelf.js"></script></head>
<body><main>
<header id="grip" title="拖动空白处移动唱片架"><button id="filter" title="切换收藏和全部专辑">收藏专辑 <span aria-hidden="true">⌄</span></button><div id="lookup">
<form id="searchForm" role="search" autocomplete="off">
<button type="button" id="searchToggle" aria-label="搜索专辑" title="搜索专辑" aria-expanded="false" aria-controls="albumQuery"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.1"/><path d="m12.3 12.3 3.9 3.9"/></svg></button>
<input id="albumQuery" role="combobox" aria-label="搜索专辑" placeholder="搜索专辑" aria-autocomplete="list" aria-expanded="false" aria-controls="albumMatches" spellcheck="false" disabled>
</form><div id="searchPanel" hidden><div id="albumMatches" role="listbox" aria-label="匹配的专辑"></div><div id="searchEmpty" role="status" hidden>没有匹配的专辑</div></div></div><output id="counter"></output>
<button id="pin" aria-label="置顶显示" aria-pressed="false" title="置顶显示"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(35 12 12)"><path d="M8 3.5h8l-1.3 3v4.1l2.8 3v1.2h-11v-1.2l2.8-3V6.5z"/><path d="M12 15v6"/></g></svg></button><button id="menu" aria-label="更多选项" title="更多选项">•••</button></header>
<section class="gallery" aria-label="Cover Flow">
<div id="stage" tabindex="0" aria-label="横向翻唱片，双击播放，上下拖出歌词，回车播放选中专辑"><div id="covers"></div></div>
<div class="caption"><h1 id="album">正在读取资料库</h1><p id="artist"></p></div>
</section>
<div class="bar"><button id="prev" aria-label="上一张专辑" title="上一张专辑"><i></i></button><button id="transport" aria-label="播放" title="播放"><i></i></button><button id="next" aria-label="下一张专辑" title="下一张专辑"><i></i></button></div>
<output id="status" aria-live="polite"></output>
<nav id="options" hidden><div class="sizes" role="group" aria-label="窗口宽度"><button data-size="classic" aria-pressed="true">经典</button><button data-size="half" aria-pressed="false">半宽</button><button data-size="wide" aria-pressed="false">全宽</button></div><button id="switch">显示全部专辑</button><button id="lyrics">歌词</button><button type="button" id="driveSoundSwitch" role="switch" aria-checked="true">仿真效果<span aria-hidden="true"></span></button><button id="refresh">刷新资料库</button><button id="dock">贴在桌面</button><button id="close">关闭唱片架</button></nav>
</main></body></html>
